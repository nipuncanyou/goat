<script>
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => cl((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eb = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const DURATION = 19.6;

// ---- one-time builders -----------------------------------------------------
(function build() {
  let b2 = '';
  for (let y = 62; y < 330; y += 26) b2 += `<rect x="258" y="${y}" width="254" height="9"/>`;
  $('blinds2').innerHTML = b2;

  let st = '';
  for (let i = 0; i < 60; i++) {
    const x = (i * 97) % 540, y = (i * 53) % 330;
    st += `<circle cx="${x}" cy="${y}" r="${1 + (i % 3) * .6}" fill="#fff" opacity="${.25 + (i % 5) * .12}"/>`;
  }
  $('stars').innerHTML = st;

  let g = '';
  for (let i = 0; i < 100; i++) {
    const c = i % 10, r = Math.floor(i / 10);
    g += `<rect id="c${i}" x="${43 + c * 46}" y="${440 + r * 26}" width="40" height="20" rx="3" fill="#8fb574" stroke="#1b1410" stroke-width="3" opacity="0"/>`;
  }
  $('grid').innerHTML = g;

  const notes = [
    ['AGENT', 'Sign here too…', 12.5, 70, 300],
    ['MUM', 'proud of you 🙂', 12.85, 340, 250],
    ['COUSIN', 'bro lend me 5k?', 13.2, 40, 400],
    ['CLUB', 'media day 7am', 13.55, 330, 380],
  ];
  $('notes4').innerHTML = notes.map((n, i) => `
    <g id="n${i}" opacity="0">
      <rect x="0" y="0" width="170" height="52" rx="12" fill="#f3eadb" stroke="#1b1410" stroke-width="4"/>
      <text x="12" y="20" font-size="10" font-weight="800" fill="#ff2d8a" class="mono" letter-spacing="2">${n[0]}</text>
      <text x="12" y="40" font-size="15" font-weight="700" fill="#1b1410">${n[1]}</text>
    </g>`).join('');
  window._notes = notes;
})();

// ---- captions (karaoke: spoken words bright, upcoming dim) ----------------
const CAPS = [
  [0.0, 2.0, 'You just signed'],
  [2.0, 4.0, 'one million dollars.'],
  [4.0, 6.0, "You're eighteen,"],
  [6.0, 8.0, "and it's real."],
  [8.2, 10.2, 'It starts now.'],
  [12.3, 13.2, "You can't even"],
  [13.2, 14.3, 'spend it yet.'],
];
function caption(t) {
  const el = $('capText');
  const c = CAPS.find(c => t >= c[0] && t < c[1]);
  if (!c) { el.textContent = ''; return; }
  const words = c[2].split(' ');
  const per = (c[1] - c[0]) * 0.8 / words.length;
  const fade = eo(seg(t, c[0], c[0] + .12)) * (1 - eo(seg(t, c[1] - .1, c[1])));
  el.setAttribute('opacity', fade);
  el.innerHTML = words.map((w, i) => {
    const on = t >= c[0] + i * per;
    return `<tspan fill="#fff" fill-opacity="${on ? 1 : .42}">${w}${i < words.length - 1 ? ' ' : ''}</tspan>`;
  }).join('');
}

const SC = ['s1', 's2', 's3', 's4', 's5'];
const show = n => SC.forEach(s => $(s).setAttribute('display', s === n ? 'inline' : 'none'));
const money = n => '$' + Math.round(n).toLocaleString('en-US');

// ---- the timeline -----------------------------------------------------------
function render(t) {
  // hard cuts, with a tiny flash on each
  const cuts = [8.2, 10.4, 12.3, 14.4];
  let f = 0;
  cuts.forEach(c => { const d = t - c; if (d >= 0 && d < .12) f = Math.max(f, .35 * (1 - d / .12)); });
  $('flash').setAttribute('opacity', f);

  if (t < 8.2) {
    show('s1');
    const push = eo(seg(t, 5.8, 8.2));          // slow dolly onto the bed at the end
    const s = 1 + .04 * seg(t, 0, 5.8) + 0.85 * push;
    const fx = 270 + (350 - 270) * push, fy = 585 + (535 - 585) * push;
    $('cam1').setAttribute('transform', `translate(270 585) scale(${s}) translate(${-fx} ${-fy})`);
    $('kidBack').setAttribute('transform', `translate(0 ${Math.sin(t * 2.2) * 2.5})`);
  } else if (t < 10.4) {
    show('s2');
    const u = t - 8.2;
    const s = 1 + .05 * seg(t, 8.2, 10.4);
    $('cam2').setAttribute('transform', `translate(270 600) scale(${s}) translate(-270 -600)`);
    $('paper2').setAttribute('transform', `translate(${Math.sin(u * 30) * 1.2} ${Math.sin(u * 4) * 3})`);
    $('eyes2').setAttribute('transform', `translate(0 ${Math.sin(u * 3) * 2})`);
  } else if (t < 12.3) {
    show('s3');
    const u = t - 10.4;
    $('kicker3').setAttribute('opacity', eo(seg(u, 0, .25)));
    const L = $('lines3').children;
    for (let i = 0; i < 4; i++) {
      const p = eb(seg(u, .15 + i * .22, .15 + i * .22 + .28));
      const o = seg(u, .15 + i * .22, .15 + i * .22 + .1);
      const y = [440, 552, 664, 776][i];
      L[i].setAttribute('opacity', o);
      L[i].setAttribute('transform', `translate(270 ${y - 40}) scale(${1.5 - .5 * p}) translate(-270 ${-(y - 40)})`);
    }
  } else if (t < 14.4) {
    show('s4');
    const u = t - 12.3;
    const s = 1.1 + .1 * seg(u, 0, 2.1);
    $('cam4').setAttribute('transform', `translate(270 420) scale(${s}) translate(-270 -420)`);
    $('kidFront').setAttribute('transform', `translate(270 ${488 + Math.sin(u * 14) * 2}) scale(1.3)`);
    $('phone').setAttribute('transform', `translate(${Math.sin(u * 55) * 2.2} 0)`);
    $('hud').setAttribute('opacity', eo(seg(u, 0, .25)));
    $('pressure').textContent = Math.round(eo(seg(u, .3, 2.0)) * 64) + '%';
    window._notes.forEach((n, i) => {
      const p = eb(seg(t, n[2], n[2] + .3));
      $('n' + i).setAttribute('opacity', seg(t, n[2], n[2] + .1));
      $('n' + i).setAttribute('transform', `translate(${n[3]} ${n[4] - 20 * p}) scale(${.6 + .4 * p})`);
    });
  } else {
    show('s5');
    const u = t - 14.4;
    // 1) one bill pops in
    const pop = eb(seg(u, .1, .55));
    const billOut = eo(seg(u, 1.0, 1.3));
    $('bill').setAttribute('transform', `translate(270 540) scale(${pop * (1 - billOut)})`);
    // 2) 100 blocks fill in
    for (let i = 0; i < 100; i++) {
      const start = 1.1 + i * 0.012;
      const c = $('c' + i);
      c.setAttribute('opacity', seg(u, start, start + .08));
      let fill = '#8fb574';
      if (u > 3.0) {
        if (i < 10) fill = mix('#8fb574', '#d9503f', seg(u, 3.0 + i * .03, 3.25 + i * .03));
        else if (i < 47) fill = mix('#8fb574', '#a59c8e', seg(u, 3.5 + (i - 10) * .025, 3.75 + (i - 10) * .025));
      }
      c.setAttribute('fill', fill);
    }
    // 3) text
    const b1 = $('big1'), b2 = $('big2');
    if (u < 3.0) {
      b1.textContent = '$1M contract ='; b2.textContent = Math.round(eo(seg(u, 1.1, 2.4)) * 100) + ' blocks';
      b1.setAttribute('opacity', seg(u, 1.1, 1.4)); b2.setAttribute('opacity', seg(u, 1.1, 1.4));
    } else {
      b1.textContent = 'You actually keep ≈';
      b2.textContent = money(1000000 - 470000 * eo(seg(u, 3.0, 4.6)));
      b1.setAttribute('opacity', 1); b2.setAttribute('opacity', 1);
    }
    $('legend').setAttribute('opacity', seg(u, 3.1, 3.5));
  }
  caption(t);
}
function mix(a, b, p) {
  const h = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16));
  const A = h(a), B = h(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * p).toString(16).padStart(2, '0')).join('');
}
window.render = render; window.DURATION = DURATION;

// ---- live playback (skipped when capturing frames) ---------------------------
if (!location.search.includes('capture')) {
  let t0 = performance.now();
  const loop = now => {
    let t = (now - t0) / 1000;
    if (t > DURATION + 1.5) { t0 = now; t = 0; }
    render(Math.min(t, DURATION));
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  document.addEventListener('click', () => { t0 = performance.now(); });
} else {
  render(0);
}
</script>
</body>
</html>
